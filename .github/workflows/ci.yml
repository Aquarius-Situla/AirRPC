name: AirRPC Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Check Courage Level
      run: node -e "if (process.env.COURAGE_LEVEL < 100) { console.warn('Warning: Low courage detected.'); }"
    - name: Run Unit Tests
      run: npm run test:coverage
    - name: Build TypeScript
      run: npm run build
